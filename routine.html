<!DOCTYPE html>
<html>
    <head>
        <title> My Class Routine</title>
    </head>
    <body >
        <style>

        #page-title {
            text-align: center;
            color: darkgreen;
            font-size: 28px;
        }
        .center {
            text-align: center;
        }
        table, th, td {
            border: 1px solid black;
            border-collapse: collapse;
            padding: 8px;
        }
        </style>

        <h1 id="page-title" >Weekly class Routine</h1>
        <p class="center">
            <img src="https://cdn.dribbble.com/userupload/30483710/file/original-3f7dd44b65ccbe9745ffa04561da3645.png" alt="Course loo" width="100" height="100">
        </p>
    <table>
        <tr>
            <th colspan="4">Class Schedule - Fall 2026</th>
        </tr>
        <tr>
            <th>Day</th>
            <th>Time</th>
            <th>Course</th>
            <th>Room</th>
        </tr>
        <tr>
            <td rowspan="2">Sunday</td>
            <td>08:30 AM</td>
            <td>Web Technologies (Theory)</td>
            <td>D101</td>
        </tr>
        <tr>
            <td>10:00 AM</td>
            <td class="lab">Web Technologies (Lab)</td>
            <td>LAB 3</td>
        </tr>
        <tr>
            <td>Tuesday</td>
            <td>09:00 AM</td>
            <td>Database Systems</td>
            <td>D204</td>
        </tr>
        <tr>
            <td>Thursday</td>
            <td>11:30 AM</td>
            <td>Software Engineering</td>
            <td>D110</td>
        </tr>
    </table>
    <form action="" method="post">
        <fieldset>
            <legend>Class feedback</legend>
            <label for="fn">Full name:</label>
            <input type="text" min="3" id="fn" required>
            <br>
            <label for="em">Email:</label>
            <input type="email" id="em" required>  
            <br>
            <label for="date">Class Date:</label>
            <input type="date" id="date" required>  
            <br>
            <label for="cn">Course:</label>
                <input type="text" id="cn" list="courses" required>
                <datalist id="cn">
                    <option value="Web Technologies (Theory)">
                    <option value="Database Systems">
                    <option value="Software Engineering">
                </datalist>         
            <br>
               <label for="rt">Rating</label>:</label>
                <input type="number" min="1"max="5" id="rt" list="1-5" required>
                <datalist id="rt">
                    <option value="1">
                    <option value="2">
                    <option value="3">
                    <option value="4">
                    <option value="5">
                </datalist>         
            <br>
            <label>Class Type:</label>
                <input type="radio" id="theory" name="class_type" value="Theory" required>
                <label for="theory">Theory</label>
                <input type="radio" id="l1" name="class_type" value="Lab" required>
                <label for="l1">Lab</label>
                <br>
            <label for="ds">Day:</label>
                <select id="ds" required>
                    <option value="">Select a day</option>
                    <option value="Sunday">Sunday</option>
                    <option value="Tuesday">Tuesday</option>
                    <option value="Thursday">Thursday</option>
                </select> 
            <br>    
            <label for="comments">Comments:</label><br>
                <textarea id="comments"  required minlength="10"></textarea>
            <br>
            <button type="submit">Send Feedback</button>          
            </fieldset>

    </form>
    </body>
</html>
